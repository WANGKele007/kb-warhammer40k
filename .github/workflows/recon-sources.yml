name: recon-sources

# 探测候选源在 GitHub Actions 机房(墙外)的可达性
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recon_sources.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Probe sources
        run: python scripts/recon_sources.py
      - name: Commit result
        run: |
          git config user.name  "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化"; else
            git commit -m "recon: source availability (runner side) [skip ci]"; git push
          fi
