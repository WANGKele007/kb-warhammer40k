name: recon

# 侦察任务:只测量 wiki 规模,不下载任何正文
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recon.py'

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run reconnaissance
        run: python scripts/recon.py

      - name: Commit report back
        run: |
          git config user.name  "kb-bot"
          git config user.email "kb-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "报告无变化,跳过提交"
          else
            git commit -m "recon: update report [skip ci]"
            git push
          fi
