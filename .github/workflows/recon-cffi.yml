name: recon-cffi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/recon_cffi.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet curl_cffi
      - run: python scripts/recon_cffi.py
      - name: Commit
        run: |
          git config user.name "kb-bot"; git config user.email "kb-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo none; else git commit -m "recon: curl_cffi probe [skip ci]"; git push; fi
